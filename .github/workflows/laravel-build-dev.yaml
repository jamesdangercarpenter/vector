# Laravel Cloud — build & push the custom log-drain Vector image to the dev ECR.
# Multi-arch (linux/arm64 + linux/amd64): each arch is built natively on its own
# self-hosted runner (no QEMU — a Rust release build of Vector under emulation is
# prohibitively slow), pushed to ECR by digest, then a merge job stitches the two
# digests into a single multi-arch manifest tagged with the branch name (and SHA).
#
# Repo/org must provide:
#   secrets.DEV_GHA_ROLE  — IAM role (OIDC) with ecr:PutImage etc. on the target repo
#   secrets.DEV_IMG_REPO  — e.g. 061051245504.dkr.ecr.us-east-2.amazonaws.com/laravel-cloud-global-laravel-vector-dev
# and access to the "laravel-*-arm64-ubuntu" and "laravel-*-x64-ubuntu" self-hosted runners.
name: Laravel build dev
on:
  push:
    branches:
      - "feat-logdrain-**"
      - "logdrain-**"
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
env:
  AWS_REGION: "us-east-2"
jobs:
  build:
    name: "Build ${{ matrix.platform }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            runner: laravel-4c16r150s-arm64-ubuntu-24.04
          - platform: linux/amd64
            runner: laravel-4c16r150s-x64-ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare platform tag
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Configure AWS dev credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_GHA_ROLE }}
          role-session-name: gha-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to dev Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Build & push by digest (${{ matrix.platform }}, native)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.laravel-vector
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ secrets.DEV_IMG_REPO }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: "Merge multi-arch manifest"
    runs-on: laravel-4c16r150s-arm64-ubuntu-24.04
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Configure AWS dev credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEV_GHA_ROLE }}
          role-session-name: gha-ecr-manifest
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to dev Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Create & push multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMG_REPO: ${{ secrets.DEV_IMG_REPO }}
        run: |
          # Sanitize the branch name into a valid image tag (mirrors the operator job).
          TAG=$(echo "$GITHUB_REF_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          docker buildx imagetools create \
            --tag "$IMG_REPO:$TAG" \
            --tag "$IMG_REPO:$GITHUB_SHA" \
            $(printf "$IMG_REPO@sha256:%s " *)
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Inspect manifest
        env:
          IMG_REPO: ${{ secrets.DEV_IMG_REPO }}
        run: docker buildx imagetools inspect "$IMG_REPO:$TAG"
